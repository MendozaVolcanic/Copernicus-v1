<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Detection - Experimental</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%);
            border-bottom: 1px solid #30363d;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header h1 { font-size: 1.1em; color: #58a6ff; }
        .badge-experimental { background: #f0883e; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.7em; font-weight: bold; }
        .btn-back { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85em; text-decoration: none; }
        .btn-back:hover { background: #30363d; }
        .header-info { font-size: 0.8em; color: #8b949e; }

        .resumen-bar { display: flex; gap: 15px; padding: 12px 20px; background: #161b22; border-bottom: 1px solid #21262d; flex-wrap: wrap; align-items: center; }
        .stat-card { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 8px; font-size: 0.85em; font-weight: 600; }
        .stat-alerta { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }
        .stat-atencion { background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }
        .stat-normal { background: rgba(63, 185, 80, 0.15); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
        .stat-nublado { background: rgba(139, 148, 158, 0.15); color: #8b949e; border: 1px solid rgba(139, 148, 158, 0.3); }
        .stat-count { font-size: 1.3em; font-weight: 700; }

        .filtros-bar { display: flex; gap: 10px; padding: 10px 20px; background: #0d1117; border-bottom: 1px solid #21262d; flex-wrap: wrap; align-items: center; }
        .filtro-label { font-size: 0.8em; color: #8b949e; }
        .filtro-btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 4px 12px; border-radius: 15px; cursor: pointer; font-size: 0.8em; }
        .filtro-btn:hover { background: #30363d; }
        .filtro-btn.active { background: #388bfd26; color: #58a6ff; border-color: #388bfd; }

        .main-content { display: flex; gap: 0; height: calc(100vh - 160px); }
        .tabla-panel { width: 420px; min-width: 420px; overflow-y: auto; border-right: 1px solid #21262d; background: #0d1117; }
        .volcan-row { display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid #161b22; cursor: pointer; gap: 10px; transition: background 0.15s; }
        .volcan-row:hover { background: #161b22; }
        .volcan-row.selected { background: #1c2333; border-left: 3px solid #58a6ff; }
        .semaforo { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
        .semaforo-ALERTA { background: #f85149; box-shadow: 0 0 6px rgba(248, 81, 73, 0.5); }
        .semaforo-ATENCION { background: #d29922; box-shadow: 0 0 6px rgba(210, 153, 34, 0.5); }
        .semaforo-NORMAL { background: #3fb950; }
        .semaforo-NUBLADO { background: #8b949e; }
        .semaforo-SIN_DATOS { background: #484f58; }
        .semaforo-ERROR { background: #484f58; }
        .volcan-info { flex: 1; min-width: 0; }
        .volcan-nombre { font-size: 0.9em; font-weight: 600; color: #e6edf3; }
        .volcan-detalle { font-size: 0.72em; color: #8b949e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .volcan-badges { display: flex; gap: 4px; flex-shrink: 0; }
        .badge-mini { font-size: 0.65em; padding: 1px 5px; border-radius: 8px; font-weight: 600; }
        .badge-nhi-ROJO { background: rgba(248, 81, 73, 0.2); color: #f85149; }
        .badge-nhi-AMARILLO { background: rgba(210, 153, 34, 0.2); color: #d29922; }
        .badge-nhi-VERDE { background: rgba(63, 185, 80, 0.2); color: #3fb950; }
        .badge-mirova { background: rgba(136, 132, 216, 0.2); color: #8884d8; }
        .zona-header { padding: 6px 15px; background: #161b22; font-size: 0.75em; font-weight: 700; color: #58a6ff; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #21262d; position: sticky; top: 0; z-index: 1; }

        .detalle-panel { flex: 1; overflow-y: auto; padding: 20px; background: #0d1117; }
        .detalle-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #484f58; font-size: 1.1em; }
        .detalle-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .detalle-titulo { font-size: 1.4em; font-weight: 700; color: #e6edf3; }
        .detalle-estado { padding: 4px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85em; }
        .estado-ALERTA { background: rgba(248, 81, 73, 0.2); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.4); }
        .estado-ATENCION { background: rgba(210, 153, 34, 0.2); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.4); }
        .estado-NORMAL { background: rgba(63, 185, 80, 0.2); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.4); }
        .estado-NUBLADO { background: rgba(139, 148, 158, 0.2); color: #8b949e; border: 1px solid rgba(139, 148, 158, 0.4); }

        .metricas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .metrica-card { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 12px; }
        .metrica-label { font-size: 0.72em; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .metrica-valor { font-size: 1.4em; font-weight: 700; }
        .metrica-sub { font-size: 0.72em; color: #8b949e; margin-top: 2px; }

        .imagenes-section { margin-bottom: 20px; }
        .imagenes-section h3 { font-size: 0.9em; color: #8b949e; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .imagenes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .imagen-card { background: #161b22; border: 1px solid #21262d; border-radius: 8px; overflow: hidden; }
        .imagen-card .img-label { padding: 6px 10px; font-size: 0.75em; font-weight: 600; color: #8b949e; background: #1c2128; border-bottom: 1px solid #21262d; }
        .imagen-card img { width: 100%; display: block; background: #000; }

        .crossref-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .crossref-card { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 14px; }
        .crossref-card h4 { font-size: 0.8em; color: #58a6ff; margin-bottom: 8px; }
        .crossref-item { display: flex; justify-content: space-between; font-size: 0.8em; padding: 3px 0; border-bottom: 1px solid #21262d; }
        .crossref-item:last-child { border-bottom: none; }
        .crossref-item .label { color: #8b949e; }

        .info-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; margin-bottom: 20px; }
        .info-box summary { cursor: pointer; font-size: 0.85em; color: #58a6ff; font-weight: 600; }
        .info-box .info-content { margin-top: 10px; font-size: 0.8em; color: #8b949e; line-height: 1.6; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

        .zone-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px 20px; background: #0d1117; border-bottom: 1px solid #21262d; }
        .zone-stat-card { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 8px 12px; }
        .zone-stat-name { font-size: 0.72em; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 700; }
        .zone-stat-row { display: flex; justify-content: space-between; font-size: 0.78em; margin-top: 2px; }

        .history-chart { display: flex; align-items: flex-end; gap: 2px; height: 48px; padding: 4px; background: #0d1117; border-radius: 6px; overflow: hidden; }
        .chart-bar { min-width: 5px; flex: 1; border-radius: 2px 2px 0 0; cursor: default; }
        .chart-bar-ALERTA { background: #f85149; }
        .chart-bar-ATENCION { background: #d29922; }
        .chart-bar-NORMAL { background: #3fb950; }
        .chart-bar-NUBLADO { background: #484f58; }
        .chart-bar-SIN_DATOS, .chart-bar-ERROR { background: #30363d; }
        .chart-legend { display: flex; gap: 10px; font-size: 0.7em; color: #8b949e; margin-bottom: 5px; }
        .chart-legend-item { display: flex; align-items: center; gap: 4px; }
        .chart-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

        .consistency-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 12px; font-size: 0.75em; font-weight: 600; margin-bottom: 12px; }
        .consistency-high { background: rgba(63, 185, 80, 0.15); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
        .consistency-pending { background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }
        .consistency-low { background: rgba(139, 148, 158, 0.15); color: #8b949e; border: 1px solid rgba(139, 148, 158, 0.3); }

        .indices-analisis-card { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 14px; margin-bottom: 20px; }
        .indices-analisis-card h4 { font-size: 0.8em; color: #58a6ff; margin-bottom: 8px; }

        @media (max-width: 900px) {
            .main-content { flex-direction: column; height: auto; }
            .tabla-panel { width: 100%; min-width: 100%; max-height: 40vh; }
            .detalle-panel { min-height: 60vh; }
            .imagenes-grid { grid-template-columns: 1fr; }
            .crossref-section { grid-template-columns: 1fr; }
            .zone-stats { grid-template-columns: repeat(2, 1fr); }
        }

        /* --- Comparacion Visual RGB-multidate (Howarth 1981) --- */
        .comparacion-visual {
            border-top: 2px solid #21262d;
            background: #0d1117;
            padding: 24px 20px 40px 20px;
        }
        .comparacion-visual h2 {
            font-size: 1.15em;
            color: #58a6ff;
            margin-bottom: 6px;
        }
        .comparacion-visual .subtitle {
            font-size: 0.82em;
            color: #8b949e;
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .cv-controles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;

            margin-bottom: 16px;

        }
        .cv-field { display: flex; flex-direction: column; gap: 4px; }
        .cv-field label {

            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;

        .cv-field select, .cv-field input[type="text"] {

            color: #e6edf3;
            border: 1px solid #30363d;

            padding: 6px 8px;

        .cv-field select:focus { outline: none; border-color: #58a6ff; }
        .cv-toggle-group { display: flex; gap: 6px; }
        .cv-toggle-btn {
            flex: 1;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78em;
        }
        .cv-toggle-btn.active {
            background: #388bfd26;
            color: #58a6ff;
            border-color: #388bfd;
        }
        .cv-btn-generar {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: #fff;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88em;
            font-weight: 600;
        }
        .cv-btn-generar:hover { filter: brightness(1.1); }
        .cv-btn-generar:disabled { opacity: 0.5; cursor: not-allowed; }
        .cv-btn-descargar {
            background: #21262d;
            color: #7ee787;
            border: 1px solid #30363d;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;

        }
        .cv-btn-descargar:hover { background: #30363d; }
        .cv-btn-descargar:disabled { opacity: 0.4; cursor: not-allowed; }

        .cv-leyenda {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 0.8em;
            color: #c9d1d9;
        }
        .cv-leyenda-item { display: flex; align-items: center; gap: 6px; }
        .cv-leyenda-swatch {
            width: 14px; height: 14px; border-radius: 3px;
            border: 1px solid #30363d;
        }
        .cv-colorbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            font-size: 0.72em;
            color: #8b949e;
        }
        .cv-colorbar-gradient {
            width: 180px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid #30363d;
            background: linear-gradient(
                to right,
                rgb(0,50,150) 0%,
                rgb(0,200,200) 25%,
                rgb(240,240,240) 50%,
                rgb(255,165,0) 75%,
                rgb(200,0,50) 100%
            );
        }
        .cv-slider-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cv-slider-wrap input[type="range"] {
            flex: 1;
            accent-color: #58a6ff;
        }
        .cv-slider-val {
            font-size: 0.78em;
            color: #58a6ff;
            min-width: 36px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .cv-resultado {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

        }
        .cv-imagen-card {
            background: #161b22;

            border-radius: 8px;

        .cv-imagen-card .cv-img-label {
            padding: 6px 10px;

            color: #8b949e;

        }
        .cv-imagen-card.composite .cv-img-label { color: #7ee787; }
        .cv-imagen-card img, .cv-imagen-card canvas {
            width: 100%;
            display: block;

        .cv-status {
            font-size: 0.8em;

            padding: 12px;

        .cv-status.error { color: #f85149; }
        .cv-spinner {
            display: inline-block;

        @media (max-width: 900px) {

</head>
<body>

<div class="header">
    <div class="header-left">
        <a href="index.html" class="btn-back">< Dashboard Principal</a>
        <h1>Change Detection</h1>
        <span class="badge-experimental">EXPERIMENTAL</span>
    </div>
    <div class="header-info" id="header-info">Cargando datos...</div>
</div>
<div id="aviso-calibracion"></div>
<div class="resumen-bar" id="resumen-bar"></div>
<div class="filtros-bar" id="filtros-bar"></div>
<div class="zone-stats" id="zone-stats"></div>
<div class="main-content">
    <div class="tabla-panel" id="tabla-volcanes"></div>
    <div class="detalle-panel" id="detalle-panel">
        <div class="detalle-placeholder">Selecciona un volcan de la lista para ver el analisis detallado</div>
    </div>
</div>

<script>
// Imagenes Sentinel-2 servidas desde raw.githubusercontent (no desde Pages):
// docs/sentinel2/ se excluye del artifact de Pages para no pasar el limite de 1GB.
const REPO_BASE = 'https://raw.githubusercontent.com/MendozaVolcanic/Copernicus-v1/main';

// --- Safe DOM helpers ---
function el(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
            if (k === 'className') e.className = v;
            else if (k === 'onclick') e.addEventListener('click', v);
            else if (k === 'textContent') e.textContent = v;
            else if (k === 'href') e.href = v;
            else if (k === 'src') e.src = v;
            else if (k === 'alt') e.alt = v;
            else if (k.startsWith('data-')) e.setAttribute(k, v);
            else e.setAttribute(k, v);
        }
    }
    if (children) {
        if (typeof children === 'string') e.textContent = children;
        else if (Array.isArray(children)) children.forEach(c => { if (c) e.appendChild(c); });
        else e.appendChild(children);
    }
    return e;
}

function text(str) { return document.createTextNode(str); }

function clearEl(e) { while (e.firstChild) e.removeChild(e.firstChild); }

// --- State ---
let datosGlobales = null;
let historialGlobal = null;
let filtroEstado = 'TODOS';
let filtroZona = 'TODAS';
let volcanSeleccionado = null;
const ORDEN_ZONAS = ['Norte', 'Centro', 'Sur', 'Austral'];
const ORDEN_ESTADO = { 'ALERTA': 0, 'ATENCION': 1, 'NUBLADO': 2, 'NORMAL': 3, 'SIN_DATOS': 4, 'ERROR': 5 };

// --- Load ---
async function cargarDatos() {
    try {
        const [respResults, respHistory] = await Promise.all([
            fetch('change_detection/change_results.json'),
            fetch('change_detection/change_history.json').catch(() => null)
        ]);
        if (!respResults.ok) throw new Error('HTTP ' + respResults.status);
        datosGlobales = await respResults.json();
        if (respHistory && respHistory.ok) {
            historialGlobal = await respHistory.json();
        }
        renderizar();
    } catch (e) {
        document.getElementById('header-info').textContent = 'Error: ' + e.message;
        const t = document.getElementById('tabla-volcanes');
        clearEl(t);
        t.appendChild(el('div', { style: 'padding:20px;color:#f85149;' }, [
            text('No se encontro change_results.json. Ejecuta: '),
            el('code', { style: 'color:#79c0ff;' }, 'python change_analysis.py --test')
        ]));
    }
}

function renderizar() {
    renderAvisoCalibracion();
    renderResumen();
    renderFiltros();
    renderZoneStats();
    renderTabla();
    document.getElementById('header-info').textContent =
        'Analisis: ' + datosGlobales.fecha_analisis + ' | ' + datosGlobales.total_volcanes + ' volcanes';
}

function renderZoneStats() {
    const container = document.getElementById('zone-stats');
    clearEl(container);
    if (!datosGlobales) return;
    const zonas = ['Norte', 'Centro', 'Sur', 'Austral'];
    for (const zona of zonas) {
        let alerta = 0, atencion = 0, normal = 0, otro = 0;
        for (const [, v] of Object.entries(datosGlobales.volcanes)) {
            if ((v.zona || '') !== zona) continue;
            if (v.estado === 'ALERTA') alerta++;
            else if (v.estado === 'ATENCION') atencion++;
            else if (v.estado === 'NORMAL') normal++;
            else otro++;
        }
        const card = el('div', { className: 'zone-stat-card' });
        card.appendChild(el('div', { className: 'zone-stat-name' }, zona));
        if (alerta > 0) {
            const row = el('div', { className: 'zone-stat-row' });
            row.appendChild(el('span', { style: 'color:#8b949e' }, 'Alerta'));
            row.appendChild(el('span', { style: 'color:#f85149;font-weight:700' }, String(alerta)));
            card.appendChild(row);
        }
        if (atencion > 0) {
            const row = el('div', { className: 'zone-stat-row' });
            row.appendChild(el('span', { style: 'color:#8b949e' }, 'Atenci\u00f3n'));
            row.appendChild(el('span', { style: 'color:#d29922;font-weight:700' }, String(atencion)));
            card.appendChild(row);
        }
        const rowN = el('div', { className: 'zone-stat-row' });
        rowN.appendChild(el('span', { style: 'color:#8b949e' }, 'Normal'));
        rowN.appendChild(el('span', { style: 'color:#3fb950' }, String(normal)));
        card.appendChild(rowN);
        container.appendChild(card);
    }
}

function renderHistoryChart(nombre) {
    if (!historialGlobal || !historialGlobal[nombre]) return null;
    const registros = historialGlobal[nombre];
    if (registros.length === 0) return null;

    const wrapper = el('div', { style: 'margin-bottom:20px;' });
    wrapper.appendChild(el('div', { style: 'font-size:0.75em;color:#8b949e;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;' },
        'Historial (' + registros.length + ' registros)'));

    const leyenda = el('div', { className: 'chart-legend' });
    const colores = [['ALERTA', '#f85149'], ['ATENCION', '#d29922'], ['NORMAL', '#3fb950']];
    for (const [label, color] of colores) {
        const item = el('div', { className: 'chart-legend-item' });
        item.appendChild(el('div', { className: 'chart-legend-dot', style: 'background:' + color }));
        item.appendChild(text(label));
        leyenda.appendChild(item);
    }
    wrapper.appendChild(leyenda);

    const chart = el('div', { className: 'history-chart' });
    const alturas = { 'ALERTA': 100, 'ATENCION': 65, 'NORMAL': 30, 'NUBLADO': 15, 'SIN_DATOS': 10, 'ERROR': 10 };
    for (const r of registros) {
        const pct = alturas[r.estado] || 10;
        const bar = el('div', { className: 'chart-bar chart-bar-' + r.estado });
        bar.style.height = pct + '%';
        bar.title = (r.fecha || '') + ': ' + r.estado + (r.cambio_termico_pct !== undefined ? ' (' + r.cambio_termico_pct + '%)' : '');
        chart.appendChild(bar);
    }
    wrapper.appendChild(chart);

    const labels = el('div', { style: 'display:flex;font-size:0.65em;color:#484f58;margin-top:2px;' });
    for (let i = 0; i < registros.length; i++) {
        const lbl = el('div', { style: 'flex:1;text-align:center;overflow:hidden;' });
        if (i % 5 === 0) {
            const fecha = registros[i].fecha || '';
            lbl.textContent = fecha.length >= 10 ? fecha.slice(5, 10) : fecha;
        }
        labels.appendChild(lbl);
    }
    wrapper.appendChild(labels);

    return wrapper;
}

function renderAvisoCalibracion() {
    // El estado por volcan solo sirve para priorizar si unos pocos estan
    // elevados. Cuando dos tercios de la poblacion salen en ALERTA, el color
    // dejo de ordenar nada y el operador no tiene como saberlo mirando la
    // pagina: cada tarjeta se ve igual de plausible que siempre.
    const cont = document.getElementById('aviso-calibracion');
    if (!cont) return;
    clearEl(cont);
    const d = datosGlobales && datosGlobales.diagnostico;
    if (!d || !d.calibracion_sospechosa) return;

    const box = el('div', { style: 'margin:0;padding:12px 20px;background:#3d1d00;'
        + 'border-bottom:1px solid #7d3b00;color:#ffa657;font-size:0.85em;line-height:1.55;' });
    box.appendChild(el('div', { style: 'font-weight:700;margin-bottom:6px;' },
        'Calibracion sospechosa: usa esta tabla para mirar, no para priorizar'));
    const ul = el('ul', { style: 'margin:0 0 0 18px;padding:0;color:#d0b090;' });
    (d.motivos || []).forEach(function (m) { ul.appendChild(el('li', {}, m)); });
    box.appendChild(ul);
    cont.appendChild(box);
}

function renderResumen() {
    const r = datosGlobales.resumen;
    const bar = document.getElementById('resumen-bar');
    clearEl(bar);
    const items = [
        ['ALERTA', 'stat-alerta', 'Alerta'],
        ['ATENCION', 'stat-atencion', 'Atencion'],
        ['NORMAL', 'stat-normal', 'Normal'],
        ['NUBLADO', 'stat-nublado', 'Nublado'],
        ['SIN_DATOS', 'stat-nublado', 'Sin datos']
    ];
    for (const [key, cls, label] of items) {
        if (r[key]) {
            bar.appendChild(el('div', { className: 'stat-card ' + cls }, [
                el('span', { className: 'stat-count' }, String(r[key])),
                text(' ' + label)
            ]));
        }
    }
}

function renderFiltros() {
    const bar = document.getElementById('filtros-bar');
    clearEl(bar);

    bar.appendChild(el('span', { className: 'filtro-label' }, 'Filtrar:'));
    const estados = [['TODOS', 'Todos'], ['ALERTA', 'Alerta'], ['ATENCION', 'Atencion'], ['NORMAL', 'Normal'], ['NUBLADO', 'Nublado']];
    for (const [val, label] of estados) {
        const btn = el('button', {
            className: 'filtro-btn' + (filtroEstado === val ? ' active' : ''),
            onclick: () => { filtroEstado = val; renderFiltros(); renderTabla(); }
        }, label);
        bar.appendChild(btn);
    }

    bar.appendChild(el('span', { className: 'filtro-label', style: 'margin-left:15px' }, 'Zona:'));
    const zonas = [['TODAS', 'Todas'], ['Norte', 'Norte'], ['Centro', 'Centro'], ['Sur', 'Sur'], ['Austral', 'Austral']];
    for (const [val, label] of zonas) {
        const btn = el('button', {
            className: 'filtro-btn' + (filtroZona === val ? ' active' : ''),
            onclick: () => { filtroZona = val; renderFiltros(); renderTabla(); }
        }, label);
        bar.appendChild(btn);
    }
}

function renderTabla() {
    const container = document.getElementById('tabla-volcanes');
    clearEl(container);
    const volcanes = datosGlobales.volcanes;

    const porZona = {};
    for (const [nombre, datos] of Object.entries(volcanes)) {
        const zona = datos.zona || 'Desconocida';
        if (!porZona[zona]) porZona[zona] = [];
        porZona[zona].push(Object.assign({ nombre }, datos));
    }
    for (const zona of Object.keys(porZona)) {
        porZona[zona].sort((a, b) => (ORDEN_ESTADO[a.estado] || 9) - (ORDEN_ESTADO[b.estado] || 9));
    }

    let hayResultados = false;
    for (const zona of ORDEN_ZONAS) {
        const lista = porZona[zona];
        if (!lista) continue;
        if (filtroZona !== 'TODAS' && filtroZona !== zona) continue;
        const filtrados = lista.filter(v => filtroEstado === 'TODOS' || v.estado === filtroEstado);
        if (filtrados.length === 0) continue;
        hayResultados = true;

        container.appendChild(el('div', { className: 'zona-header' }, zona + ' (' + filtrados.length + ')'));

        for (const v of filtrados) {
            const row = el('div', {
                className: 'volcan-row' + (volcanSeleccionado === v.nombre ? ' selected' : ''),
                onclick: () => seleccionarVolcan(v.nombre)
            });

            row.appendChild(el('div', { className: 'semaforo semaforo-' + v.estado }));

            const info = el('div', { className: 'volcan-info' });
            info.appendChild(el('div', { className: 'volcan-nombre' }, v.nombre));
            info.appendChild(el('div', { className: 'volcan-detalle' }, v.detalle || ''));
            row.appendChild(info);

            const badges = el('div', { className: 'volcan-badges' });
            if (v.nhi) badges.appendChild(el('span', { className: 'badge-mini badge-nhi-' + v.nhi.estado }, 'NHI'));
            if (v.mirova && v.mirova.disponible) badges.appendChild(el('span', { className: 'badge-mini badge-mirova' }, 'MIROVA'));
            row.appendChild(badges);

            container.appendChild(row);
        }
    }
    if (!hayResultados) {
        container.appendChild(el('div', { style: 'padding:20px;color:#8b949e;' }, 'Sin resultados para el filtro actual'));
    }
}

function seleccionarVolcan(nombre) {
    volcanSeleccionado = nombre;
    renderTabla();
    renderDetalle(nombre);
}

function formatNum(n) {
    if (n === undefined || n === null) return 'N/A';
    return typeof n === 'number' ? n.toFixed(1) : String(n);
}

function colorMetrica(valor, alto, medio) {
    if (valor === undefined || valor === null) return '#8b949e';
    if (valor >= alto) return '#f85149';
    if (valor >= medio) return '#d29922';
    return '#3fb950';
}

function crearMetrica(label, valor, color, sub) {
    const card = el('div', { className: 'metrica-card' });
    card.appendChild(el('div', { className: 'metrica-label' }, label));
    const valEl = el('div', { className: 'metrica-valor' }, valor);
    valEl.style.color = color;
    card.appendChild(valEl);
    card.appendChild(el('div', { className: 'metrica-sub' }, sub));
    return card;
}

function crearCrossrefItem(label, valor) {
    const item = el('div', { className: 'crossref-item' });
    item.appendChild(el('span', { className: 'label' }, label));
    item.appendChild(el('span', {}, String(valor)));
    return item;
}

function crearImagenCard(labelText, src) {
    const card = el('div', { className: 'imagen-card' });
    card.appendChild(el('div', { className: 'img-label' }, labelText));
    const img = el('img', { src: src, alt: labelText });
    img.onerror = function() { this.alt = 'Imagen no disponible'; this.src = ''; };
    card.appendChild(img);
    return card;
}

function renderDetalle(nombre) {
    const v = datosGlobales.volcanes[nombre];
    if (!v) return;
    const panel = document.getElementById('detalle-panel');
    clearEl(panel);

    // Helper: construye URL de imagen en el repo raw, encodeando el nombre del
    // volcan (nombres con espacios o ' - ' rompen raw.githubusercontent si van crudos).
    const imgUrl = (fecha, tipo) =>
        REPO_BASE + '/docs/sentinel2/' + encodeURIComponent(nombre) + '/' + fecha + '_' + tipo + '.png';

    // Header
    const header = el('div', { className: 'detalle-header' });
    const headerLeft = el('div');
    headerLeft.appendChild(el('div', { className: 'detalle-titulo' }, nombre));
    headerLeft.appendChild(el('div', { style: 'font-size:0.8em;color:#8b949e;margin-top:4px;' },
        'Zona ' + (v.zona || '') + ' | Confianza: ' + (v.confianza || 'N/A') + ' | ' + (v.fecha_nueva || '')));
    header.appendChild(headerLeft);
    header.appendChild(el('span', { className: 'detalle-estado estado-' + v.estado }, v.estado));
    panel.appendChild(header);

    // Detalle texto
    const detalleBox = el('div', { style: 'background:#161b22;border:1px solid #21262d;border-radius:8px;padding:12px;margin-bottom:20px;font-size:0.85em;color:#c9d1d9;' },
        v.detalle || 'Sin detalle disponible');
    panel.appendChild(detalleBox);

    // Métricas
    const metricas = el('div', { className: 'metricas-grid' });
    metricas.appendChild(crearMetrica('Cambio termico', formatNum(v.cambio_termico_pct) + '%',
        colorMetrica(v.cambio_termico_pct, 5, 2), 'Pixeles con anomalia termica'));
    metricas.appendChild(crearMetrica('Cambio morfologico', formatNum(v.cambio_morfologico_pct) + '%',
        colorMetrica(v.cambio_morfologico_pct, 30, 15), 'Area con cambio visual'));
    metricas.appendChild(crearMetrica('Max diff termico', formatNum(v.max_diff_termico),
        colorMetrica(v.max_diff_termico, 150, 80), 'Diferencia maxima canal SWIR2 (0-255)'));
    metricas.appendChild(crearMetrica('Nubes', formatNum(v.nube_pct) + '%', '#8b949e', 'Cobertura excluida del analisis'));
    if (v.z_score_termico !== undefined && v.z_score_termico !== null) {
        const zColor = v.z_score_termico > 3 ? '#f85149' : v.z_score_termico > 2 ? '#d29922' : '#3fb950';
        metricas.appendChild(crearMetrica('Z-score termico', formatNum(v.z_score_termico),
            zColor, 'Desviaciones sobre variabilidad historica del volcan'));
    }

    // Sprint 1: NHI (Marchese 2019) — Sentinel-2 + Landsat lado a lado
    function pushNhi(label, stats, refBands) {
        if (!stats) {
            metricas.appendChild(crearMetrica(label, '—', '#8b949e', 'No disponible'));
            return;
        }
        const nhiMax = stats.nhi_max;
        const nhiColor = nhiMax > 0.4 ? '#f85149' : nhiMax > 0.2 ? '#d29922' : '#3fb950';
        const nHot = stats.n_hot_pixels_nhi || 0;
        const nStrict = stats.n_hot_pixels_nhi_strict || 0;
        metricas.appendChild(crearMetrica(label + ' max', formatNum(nhiMax),
            nhiColor, refBands + ', pico'));
        metricas.appendChild(crearMetrica(label + ' hot px',
            String(nHot),
            nHot > 5 ? '#d29922' : '#3fb950',
            'Strict: ' + nStrict + ' · umbral ' + (stats.umbral_nhi || '?')));
    }
    pushNhi('NHI S2', v.nhi_s2_stats || v.nhi_stats, '(B12-B11)/(B12+B11)');
    pushNhi('NHI Landsat', v.nhi_landsat_stats, '(B7-B6)/(B7+B6)');

    // Cross-validación S2/Landsat
    const cv = v.cross_validacion_nhi;
    if (cv) {
        let cvText = '—';
        let cvColor = '#8b949e';
        if (cv.triple_confirmacion) {
            cvText = 'Triple confirmación térmica'; cvColor = '#f85149';
        } else if (cv.doble_confirmacion_nhi) {
            cvText = 'Doble confirmación NHI'; cvColor = '#d29922';
        } else if (cv.asimetria_sensor) {
            cvText = cv.asimetria_sensor; cvColor = '#d29922';
        } else if (cv.nhi_s2 && cv.nhi_landsat && cv.nhi_s2 !== 'SIN_DATOS' && cv.nhi_landsat !== 'SIN_DATOS') {
            cvText = 'S2 y Landsat coinciden'; cvColor = '#3fb950';
        }
        metricas.appendChild(crearMetrica('Cross-val NHI', cvText, cvColor,
            (cv.misma_semana ? 'Misma semana ' : 'Fechas distintas ') +
            '· S2=' + (cv.fecha_s2 || '—') + ' · L8=' + (cv.fecha_landsat || '—')));
    }

    // VRP CALIBRADO REAL (Wooster 2003 / Coppola 2016) — autoritativo si .npz SWIR_raw existe.
    // Verde porque está calibrado en Watts vs. solar irradiance E(B12)=84.86 W/m²/µm.
    if (v.vrp_calibrado_mw !== undefined && v.vrp_calibrado_mw !== null) {
        const vrpC = v.vrp_calibrado_mw;
        const nivelC = v.vrp_calibrado_nivel || 'Low';
        const colorC = vrpC >= 100 ? '#f85149' : vrpC >= 10 ? '#d29922' : vrpC > 0 ? '#3fb950' : '#3fb950';
        metricas.appendChild(crearMetrica('VRP calibrado',
            formatNum(vrpC) + ' MW',
            colorC,
            'Nivel: ' + nivelC + ' · ' + (v.vrp_calibrado_n_pixels || 0) + ' px · B12 reflectancia BOA (Wooster 2003)'));
    }

    // VRP PROXY (legacy) — escala empírica del PNG ThermalFalseColor. NO comparable
    // a MIROVA. Se mantiene visible para auditoría histórica; amarillo indica caveat.
    if (v.vrp_estimado_mw !== undefined && v.vrp_estimado_mw !== null) {
        const vrp = v.vrp_estimado_mw;
        const nivel = v.nivel_termico || 'Low';
        const esFallback = (v.vrp_calibrado_mw === undefined || v.vrp_calibrado_mw === null);
        const vrpColor = esFallback
            ? (vrp >= 100 ? '#f85149' : vrp >= 10 ? '#d29922' : vrp > 0 ? '#79c0ff' : '#3fb950')
            : '#8b949e';  // si hay calibrado, el proxy se desatena
        metricas.appendChild(crearMetrica(
            esFallback ? 'VRP proxy (fallback)' : 'VRP proxy (legacy)',
            formatNum(vrp) + ' MW',
            vrpColor,
            'Nivel: ' + nivel + ' · ' + (v.vrp_pixels || 0) + ' px · proxy SWIR no calibrado'));
    } else if (v.vrp_calibrado_mw === undefined || v.vrp_calibrado_mw === null) {
        metricas.appendChild(crearMetrica('VRP', '—', '#8b949e', 'No calculado'));
    }

    if (v.ndsi_aplicado) {
        metricas.appendChild(crearMetrica('Filtro NDSI', 'Activo', '#79c0ff',
            'Glaciar — pixeles de nieve excluidos'));
    }

    // Mahalanobis (Zhang 2016 LSMAD) — multivariado
    const mh = v.mahalanobis_stats;
    if (mh && mh.mahalanobis_max !== undefined) {
        const dMax = mh.mahalanobis_max;
        const mhColor = dMax > 5 ? '#f85149' : dMax > 3 ? '#d29922' : '#3fb950';
        metricas.appendChild(crearMetrica('Mahalanobis d_max', formatNum(dMax),
            mhColor, 'Distancia multivariada (umbral chi^2 95%=3.0)'));
        metricas.appendChild(crearMetrica('Mahalanobis anomalos',
            (mh.n_anomalous_pixels || 0) + ' px (' + formatNum(mh.pct_anomalous || 0) + '%)',
            (mh.pct_anomalous || 0) > 3 ? '#f85149' : (mh.pct_anomalous || 0) > 1 ? '#d29922' : '#3fb950',
            'N imgs baseline: ' + (mh.n_imagenes_baseline || 0)));
    } else {
        metricas.appendChild(crearMetrica('Mahalanobis', '—', '#8b949e',
            (mh && mh.nota) ? mh.nota : 'No calculado'));
    }

    panel.appendChild(metricas);

    // Sprint 2: Triple consenso vs divergencia (Z-score / NHI / Mahalanobis)
    const algos = [];
    if (v.z_score_estado) algos.push(['Z-score', v.z_score_estado]);
    if (v.nhi_estado && v.nhi_estado !== 'SIN_DATOS') algos.push(['NHI', v.nhi_estado]);
    if (v.mahalanobis_estado && v.mahalanobis_estado !== 'SIN_DATOS') algos.push(['Mahalanobis', v.mahalanobis_estado]);
    if (algos.length >= 2) {
        const estadosSet = new Set(algos.map(function(a){return a[1];}));
        const consensoTriple = (algos.length === 3 && estadosSet.size === 1);
        const consensoBox = el('div', {
            style: 'background:#1c2128;border-radius:6px;padding:10px 14px;' +
                   'margin-bottom:16px;font-size:0.82em;color:#c9d1d9;' +
                   'border-left:3px solid ' + (consensoTriple ? '#3fb950' : (estadosSet.size === 1 ? '#79c0ff' : '#d29922')) + ';'
        });
        let titulo, color;
        if (consensoTriple) { titulo = 'Triple consenso'; color = '#3fb950'; }
        else if (estadosSet.size === 1) { titulo = 'Consenso parcial'; color = '#79c0ff'; }
        else { titulo = 'Divergencia algoritmos'; color = '#d29922'; }
        consensoBox.appendChild(el('div', { style: 'font-weight:700;color:' + color + ';margin-bottom:4px;' }, titulo));
        const detalleAlgos = algos.map(function(a){ return a[0] + ': ' + a[1]; }).join(' · ');
        consensoBox.appendChild(el('div', {}, detalleAlgos));
        if (v.nhi_detalle && v.nhi_estado && v.nhi_estado !== 'NORMAL' && v.nhi_estado !== 'SIN_DATOS') {
            consensoBox.appendChild(el('div', { style: 'margin-top:4px;color:#8b949e;font-size:0.92em;' },
                'NHI: ' + v.nhi_detalle));
        }
        panel.appendChild(consensoBox);
    }

    // Badge de consistencia temporal
    if (v.consistencia_temporal) {
        const ct = v.consistencia_temporal;
        let cls, txt;
        if (ct.consistent && ct.consecutive_elevated >= 2) {
            cls = 'consistency-high'; txt = 'Consistente (' + ct.consecutive_elevated + ' dias elevado)';
        } else if (ct.consistent) {
            cls = 'consistency-pending'; txt = 'Un dia previo elevado — pendiente confirmacion';
        } else {
            cls = 'consistency-low'; txt = 'Evento aislado — sin confirmacion temporal';
        }
        panel.appendChild(el('div', { className: 'consistency-badge ' + cls }, txt));
    }

    // Grafico historico
    const histChart = renderHistoryChart(nombre);
    if (histChart) panel.appendChild(histChart);

    // Card de analisis de indices espectrales
    if (v.indices_spectral) {
        const sp = v.indices_spectral;
        const spCard = el('div', { className: 'indices-analisis-card' });
        spCard.appendChild(el('h4', {}, 'Analisis Indices Espectrales'));
        spCard.appendChild(crearCrossrefItem('NDVI estable:', sp.ndvi_stable ? 'Si (vegetacion sin cambio)' : 'No (posible alteracion)'));
        spCard.appendChild(crearCrossrefItem('Anomalia SWIR:', sp.swir_anomaly_confirmed ?
            'Confirmada (' + (sp.swir_pct || 0) + '% pixeles)' : 'No detectada'));
        spCard.appendChild(crearCrossrefItem('dNBR cambio:', (sp.dnbr_pct || 0) + '% pixeles alterados'));
        if (sp.disponibles && sp.disponibles.length > 0) {
            spCard.appendChild(crearCrossrefItem('Indices disponibles:', sp.disponibles.join(', ')));
        }
        panel.appendChild(spCard);
    }

    // Cross-ref
    const crossref = el('div', { className: 'crossref-section' });

    // NHI card
    const nhiCard = el('div', { className: 'crossref-card' });
    nhiCard.appendChild(el('h4', {}, 'NHI (Anomalias termales)'));
    if (v.nhi) {
        const estadoBadge = el('span', { className: 'badge-mini badge-nhi-' + v.nhi.estado }, v.nhi.estado);
        const estadoItem = el('div', { className: 'crossref-item' });
        estadoItem.appendChild(el('span', { className: 'label' }, 'Estado:'));
        estadoItem.appendChild(estadoBadge);
        nhiCard.appendChild(estadoItem);
        nhiCard.appendChild(crearCrossrefItem('Alertas 7 dias:', v.nhi.alertas_7d));
        nhiCard.appendChild(crearCrossrefItem('Alertas 30 dias:', v.nhi.alertas_30d));
        nhiCard.appendChild(crearCrossrefItem('Ultima alerta:', v.nhi.ultima_alerta || 'Ninguna'));
        nhiCard.appendChild(crearCrossrefItem('Registros totales:', v.nhi.total_registros));
    } else {
        nhiCard.appendChild(el('div', { style: 'font-size:0.8em;color:#484f58;' }, 'Sin datos NHI disponibles'));
    }
    crossref.appendChild(nhiCard);

    // Mirova card
    const mirovaCard = el('div', { className: 'crossref-card' });
    mirovaCard.appendChild(el('h4', {}, 'MIROVA (VRP)'));
    if (v.mirova && v.mirova.disponible && v.mirova.registros_recientes > 0) {
        mirovaCard.appendChild(crearCrossrefItem('VRP max 7 dias:', v.mirova.vrp_max_reciente + ' MW'));
        mirovaCard.appendChild(crearCrossrefItem('VRP promedio 7 dias:', (v.mirova.vrp_promedio_reciente || 0) + ' MW'));
        mirovaCard.appendChild(crearCrossrefItem('Registros recientes:', v.mirova.registros_recientes));
        mirovaCard.appendChild(crearCrossrefItem('Ultimo registro:', v.mirova.ultimo_registro || 'N/A'));
    } else if (v.mirova) {
        mirovaCard.appendChild(el('div', { style: 'font-size:0.8em;color:#484f58;' }, 'Sin registros recientes'));
    } else {
        mirovaCard.appendChild(el('div', { style: 'font-size:0.8em;color:#484f58;' }, 'Volcan no monitoreado por MIROVA (11 de 43)'));
    }
    crossref.appendChild(mirovaCard);
    panel.appendChild(crossref);

    // Imágenes Thermal
    if (v.fecha_nueva && v.fecha_anterior) {
        const thermalSection = el('div', { className: 'imagenes-section' });
        thermalSection.appendChild(el('h3', {}, 'Thermal False Color (SWIR2/SWIR1/Red)'));
        const thermalGrid = el('div', { className: 'imagenes-grid' });
        thermalGrid.appendChild(crearImagenCard('Anterior: ' + v.fecha_anterior,
            imgUrl(v.fecha_anterior, 'ThermalFalseColor')));
        thermalGrid.appendChild(crearImagenCard('Reciente: ' + v.fecha_nueva,
            imgUrl(v.fecha_nueva, 'ThermalFalseColor')));
        thermalSection.appendChild(thermalGrid);
        panel.appendChild(thermalSection);

        const rgbSection = el('div', { className: 'imagenes-section' });
        rgbSection.appendChild(el('h3', {}, 'RGB (Color Natural)'));
        const rgbGrid = el('div', { className: 'imagenes-grid' });
        rgbGrid.appendChild(crearImagenCard('Anterior: ' + v.fecha_anterior,
            imgUrl(v.fecha_anterior, 'RGB')));
        rgbGrid.appendChild(crearImagenCard('Reciente: ' + v.fecha_nueva,
            imgUrl(v.fecha_nueva, 'RGB')));
        rgbSection.appendChild(rgbGrid);
        panel.appendChild(rgbSection);
    }

    // Índices espectrales (NDVI, NBR, SWIR_Anomaly) — si están disponibles
    if (v.indices_disponibles && Object.keys(v.indices_disponibles).length > 0) {
        const indicesSection = el('div', { className: 'imagenes-section' });
        indicesSection.appendChild(el('h3', {}, 'Indices Espectrales (fecha: ' + v.fecha_nueva + ')'));

        const indicesInfo = {

// =============================================================
// Comparacion Visual RGB-multidate (Tecnica #1, Howarth 1981)
// =============================================================
// Composicion: R = fecha A (luminancia), G = fecha B (luminancia),
//              B = (lumA + lumB) / 2
// -> sin cambio    -> grises/blancos
// -> aparecio en B -> cian (verde + azul intermedio)
// -> desaparecio   -> rojo (rojo + azul intermedio)

let cvFechasPorVolcan = null;   // {volcan: [fechas...]}
let cvTipoImagen = 'RGB';        // 'RGB' | 'ThermalFalseColor'
let cvTipoVisualizacion = 'multidate'; // 'multidate' | 'heatmap' | 'highlight'
let cvSensibilidad = 5;          // % umbral (0-100) — píxeles con |diff|<umbral se ven blancos
let cvHlOpacidad = 60;           // % opacidad del overlay rojo (Técnica #3 Highlight)
let cvHlUmbral = 15;             // % umbral mínimo de cambio en luminancia (Técnica #3)
// Cache de imágenes cargadas para regenerar en tiempo real sin re-descargar
let cvImgACache = null;
let cvImgBCache = null;

async function cvCargarFechas() {
    if (cvFechasPorVolcan) return cvFechasPorVolcan;
    const resp = await fetch('fechas_disponibles_copernicus.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    cvFechasPorVolcan = await resp.json();
    return cvFechasPorVolcan;
}

function cvLoadImg(src) {
    return new Promise((res, rej) => {
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = () => res(im);
        im.onerror = () => rej(new Error('No se pudo cargar ' + src));
        im.src = src;
    });
}

function cvDrawToOffscreen(img, w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    return ctx.getImageData(0, 0, w, h);
}

// --- Heatmap divergente turbo (Tecnica #2, Eastman & Fulk 1993 / Bovolo 2007) ---
function cvInterpColor(c1, c2, t) {
    return [
        c1[0] + (c2[0] - c1[0]) * t,
        c1[1] + (c2[1] - c1[1]) * t,
        c1[2] + (c2[2] - c1[2]) * t
    ];
}

// valor in [-1, 1] -> [r, g, b] divergente cool-warm
function cvColorDivergente(valor) {
    if (valor <= -1) return [0, 50, 150];
    if (valor >=  1) return [200, 0, 50];
    if (valor < -0.5) {
        const t = (valor + 1) / 0.5;
        return cvInterpColor([0, 50, 150], [0, 200, 200], t);
    } else if (valor < 0) {
        const t = (valor + 0.5) / 0.5;
        return cvInterpColor([0, 200, 200], [240, 240, 240], t);
    } else if (valor < 0.5) {
        const t = valor / 0.5;
        return cvInterpColor([240, 240, 240], [255, 165, 0], t);
    } else {
        const t = (valor - 0.5) / 0.5;
        return cvInterpColor([255, 165, 0], [200, 0, 50], t);
    }
}

function cvGenerarHeatmap(imgA, imgB, canvas, sensPct) {
    const W = Math.min(imgA.naturalWidth || 800, imgB.naturalWidth || 800);
    const H = Math.min(imgA.naturalHeight || 800, imgB.naturalHeight || 800);
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    const dataA = cvDrawToOffscreen(imgA, W, H).data;
    const dataB = cvDrawToOffscreen(imgB, W, H).data;
    const out = ctx.createImageData(W, H);

    // Umbral en unidades [0,255]: sensPct% del rango total
    const umbral = (sensPct / 100) * 255;

    for (let i = 0; i < dataA.length; i += 4) {
        const lumA = 0.299 * dataA[i] + 0.587 * dataA[i + 1] + 0.114 * dataA[i + 2];
        const lumB = 0.299 * dataB[i] + 0.587 * dataB[i + 1] + 0.114 * dataB[i + 2];
        const diff = lumB - lumA;   // [-255, 255]

        if (Math.abs(diff) < umbral) {
            // Sin cambio significativo -> blanco
            out.data[i]     = 240;
            out.data[i + 1] = 240;
            out.data[i + 2] = 240;
            out.data[i + 3] = 255;
        } else {
            // Normalizar a [-1, 1] (escala 255)
            const norm = Math.max(-1, Math.min(1, diff / 255));
            const c = cvColorDivergente(norm);
            out.data[i]     = c[0];
            out.data[i + 1] = c[1];
            out.data[i + 2] = c[2];
            out.data[i + 3] = 255;
        }
    }
    ctx.putImageData(out, 0, 0);
}

// --- Highlight overlay (Técnica #3, Hansen 2013 style — Global Forest Watch) ---
// Imagen base = fecha B; encima máscara roja translúcida donde |lumB - lumA| > umbral.
function cvGenerarHighlight(imgA, imgB, canvas, opacidadPct, umbralPct) {
    const W = Math.min(imgA.naturalWidth || 800, imgB.naturalWidth || 800);
    const H = Math.min(imgA.naturalHeight || 800, imgB.naturalHeight || 800);
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    // 1. Dibujar imagen B como base
    ctx.drawImage(imgB, 0, 0, W, H);

    // 2. Datos de ambas imágenes desde canvas offscreen
    const dataA = cvDrawToOffscreen(imgA, W, H).data;
    const dataB = cvDrawToOffscreen(imgB, W, H).data;

    // 3. Construir máscara roja
    const mask = ctx.createImageData(W, H);
    const umbralAbs = (umbralPct / 100) * 255;
    const opacFactor = opacidadPct / 100;
    for (let i = 0; i < dataA.length; i += 4) {
        const lumA = 0.299 * dataA[i] + 0.587 * dataA[i + 1] + 0.114 * dataA[i + 2];
        const lumB = 0.299 * dataB[i] + 0.587 * dataB[i + 1] + 0.114 * dataB[i + 2];
        const diff = Math.abs(lumB - lumA);
        if (diff > umbralAbs) {
            const intensity = Math.min(1, diff / 255);
            mask.data[i]     = 255;                                   // R
            mask.data[i + 1] = 0;                                     // G
            mask.data[i + 2] = 0;                                     // B
            mask.data[i + 3] = Math.round(intensity * 255 * opacFactor); // alpha
        } else {
            mask.data[i + 3] = 0; // transparente
        }
    }

    // 4. Componer máscara sobre imagen B usando canvas temporal (putImageData ignora alpha previo)
    const maskCanvas = document.createElement('canvas');
    maskCanvas.width = W;
    maskCanvas.height = H;
    maskCanvas.getContext('2d').putImageData(mask, 0, 0);
    ctx.drawImage(maskCanvas, 0, 0);
}

function cvGenerarComposicion(imgA, imgB, canvas) {
    const W = Math.min(imgA.naturalWidth || 800, imgB.naturalWidth || 800);
    const H = Math.min(imgA.naturalHeight || 800, imgB.naturalHeight || 800);
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    const dataA = cvDrawToOffscreen(imgA, W, H).data;
    const dataB = cvDrawToOffscreen(imgB, W, H).data;
    const out = ctx.createImageData(W, H);

    for (let i = 0; i < dataA.length; i += 4) {
        // Luminancia (Rec.601) para colapsar cada imagen a un escalar
        const lumA = 0.299 * dataA[i] + 0.587 * dataA[i + 1] + 0.114 * dataA[i + 2];
        const lumB = 0.299 * dataB[i] + 0.587 * dataB[i + 1] + 0.114 * dataB[i + 2];
        out.data[i]     = lumA;            // R = fecha A
        out.data[i + 1] = lumB;            // G = fecha B
        out.data[i + 2] = (lumA + lumB) / 2; // B = promedio
        out.data[i + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
}

function cvSetVisualizacion(vis) {
    cvTipoVisualizacion = vis;
    document.querySelectorAll('#cv-section .cv-toggle-btn[data-vis]').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-vis') === vis);
    });
    // Mostrar/ocultar slider de sensibilidad (heatmap) y sliders highlight
    const fldSens = document.getElementById('cv-field-sensibilidad');
    if (fldSens) fldSens.style.display = (vis === 'heatmap') ? 'flex' : 'none';
    const fldHlOp = document.getElementById('cv-field-hl-opacidad');
    if (fldHlOp) fldHlOp.style.display = (vis === 'highlight') ? 'flex' : 'none';
    const fldHlUm = document.getElementById('cv-field-hl-umbral');
    if (fldHlUm) fldHlUm.style.display = (vis === 'highlight') ? 'flex' : 'none';
    // Cambiar label del card central
    const lblC = document.getElementById('cv-label-composite');
    if (lblC) {
        if (vis === 'heatmap') {
            lblC.textContent = 'Heatmap divergente (B − A)';
        } else if (vis === 'highlight') {
            lblC.textContent = 'Highlight overlay (Hansen 2013)';
        } else {
            lblC.textContent = 'Composición RGB-multidate';
        }
    }
    cvRenderLeyenda();
    // Si ya hay imágenes cargadas, regenerar al cambiar de modo
    cvRegenerarSiHayCache();
}

// Regenera el canvas usando las imágenes en caché (sin re-descargar) cuando
// el usuario mueve los sliders del modo highlight.
function cvRegenerarSiHighlight() {
    if (cvTipoVisualizacion !== 'highlight') return;
    if (!cvImgACache || !cvImgBCache) return;
    const canvas = document.getElementById('cv-canvas-composite');
    if (!canvas) return;
    cvGenerarHighlight(cvImgACache, cvImgBCache, canvas, cvHlOpacidad, cvHlUmbral);
}

// Regenera el canvas al cambiar de modo de visualización (sin re-descargar imágenes).
function cvRegenerarSiHayCache() {
    if (!cvImgACache || !cvImgBCache) return;
    const canvas = document.getElementById('cv-canvas-composite');
    if (!canvas) return;
    if (cvTipoVisualizacion === 'heatmap') {
        cvGenerarHeatmap(cvImgACache, cvImgBCache, canvas, cvSensibilidad);
    } else if (cvTipoVisualizacion === 'highlight') {
        cvGenerarHighlight(cvImgACache, cvImgBCache, canvas, cvHlOpacidad, cvHlUmbral);
    } else {
        cvGenerarComposicion(cvImgACache, cvImgBCache, canvas);
    }
}

function cvRenderLeyenda() {
    const leyenda = document.getElementById('cv-leyenda');
    if (!leyenda) return;
    clearEl(leyenda);

    if (cvTipoVisualizacion === 'highlight') {
        const items = [
            ['rgba(255, 0, 0, 0.7)', '🟥 Áreas con cambio significativo (>' + cvHlUmbral + '%)'],
            ['rgb(220, 220, 220)',   '⚪ Áreas estables (sin cambio sobre umbral)']
        ];
        for (const [color, txt] of items) {
            const item = el('div', { className: 'cv-leyenda-item' });
            const sw = el('div', { className: 'cv-leyenda-swatch' });
            sw.style.background = color;
            item.appendChild(sw);
            item.appendChild(text(txt));
            leyenda.appendChild(item);
        }
        return;
    }

    if (cvTipoVisualizacion === 'heatmap') {
        const items = [
            ['rgb(0,50,150)',    '🔵 Cambio negativo fuerte (A ≫ B, desapareció)'],
            ['rgb(0,200,200)',   'Cambio negativo leve (A > B)'],
            ['rgb(240,240,240)', '⬜ Sin cambio (bajo umbral)'],
            ['rgb(255,165,0)',   'Cambio positivo leve (B > A)'],
            ['rgb(200,0,50)',    '🔴 Cambio positivo fuerte (B ≫ A, apareció)']
        ];
        for (const [color, txt] of items) {
            const item = el('div', { className: 'cv-leyenda-item' });
            const sw = el('div', { className: 'cv-leyenda-swatch' });
            sw.style.background = color;
            item.appendChild(sw);
            item.appendChild(text(txt));
            leyenda.appendChild(item);
        }
        // Barra de colores horizontal (gradiente turbo divergente)
        const cbar = el('div', { className: 'cv-colorbar' });
        cbar.appendChild(text('−'));
        cbar.appendChild(el('div', { className: 'cv-colorbar-gradient' }));
        cbar.appendChild(text('+'));
        leyenda.appendChild(cbar);
    } else {
        const items = [
            ['rgb(220, 60, 60)',   '🔴 Rojo → desapareció (estaba en A, no en B)'],
            ['rgb(80, 200, 220)',  '🟦 Cian → apareció (no estaba en A, ahora en B)'],
            ['rgb(220, 220, 220)', '⚪ Gris / blanco → sin cambio'],
            ['rgb(20, 20, 20)',    '⬛ Negro → sin cobertura / nubes en ambas']
        ];
        for (const [color, txt] of items) {
            const item = el('div', { className: 'cv-leyenda-item' });
            const sw = el('div', { className: 'cv-leyenda-swatch' });
            sw.style.background = color;
            item.appendChild(sw);
            item.appendChild(text(txt));
            leyenda.appendChild(item);
        }
    }
}

function cvPopularVolcanes() {
    const sel = document.getElementById('cv-volcan');
    clearEl(sel);
    sel.appendChild(el('option', { value: '' }, '— Selecciona —'));
    const nombres = Object.keys(cvFechasPorVolcan).sort((a, b) => a.localeCompare(b));
    for (const n of nombres) {
        sel.appendChild(el('option', { value: n }, n));
    }
    sel.addEventListener('change', cvPopularFechas);
}

function cvPopularFechas() {
    const volcan = document.getElementById('cv-volcan').value;
    const selA = document.getElementById('cv-fecha-a');
    const selB = document.getElementById('cv-fecha-b');
    clearEl(selA);
    clearEl(selB);
    selA.appendChild(el('option', { value: '' }, '—'));
    selB.appendChild(el('option', { value: '' }, '—'));
    if (!volcan || !cvFechasPorVolcan[volcan]) return;
    const fechas = cvFechasPorVolcan[volcan].slice().sort();
    for (const f of fechas) {
        selA.appendChild(el('option', { value: f }, f));
        selB.appendChild(el('option', { value: f }, f));
    }
    // Defaults: A = antepenultima, B = ultima
    if (fechas.length >= 2) {
        selA.value = fechas[fechas.length - 2];
        selB.value = fechas[fechas.length - 1];
    }
}

async function cvGenerarYRenderizar() {
    const volcan = document.getElementById('cv-volcan').value;
    const fechaA = document.getElementById('cv-fecha-a').value;
    const fechaB = document.getElementById('cv-fecha-b').value;
    const status = document.getElementById('cv-status');
    const btnGen = document.getElementById('cv-btn-generar');
    const btnDl = document.getElementById('cv-btn-descargar');

    if (!volcan || !fechaA || !fechaB) {
        status.className = 'cv-status error';
        status.textContent = 'Selecciona volcán y ambas fechas antes de generar.';
        return;
    }
    if (fechaA === fechaB) {
        status.className = 'cv-status error';
        status.textContent = 'Las fechas A y B deben ser distintas.';
        return;
    }

    btnGen.disabled = true;
    btnDl.disabled = true;
    status.className = 'cv-status';
    clearEl(status);
    const sp = el('span', { className: 'cv-spinner' });
    status.appendChild(sp);
    status.appendChild(text('Generando comparación...'));

    const urlA = REPO_BASE + '/docs/sentinel2/' + encodeURIComponent(volcan) + '/' + fechaA + '_' + cvTipoImagen + '.png';
    const urlB = REPO_BASE + '/docs/sentinel2/' + encodeURIComponent(volcan) + '/' + fechaB + '_' + cvTipoImagen + '.png';

    const imgEA = document.getElementById('cv-img-a');
    const imgEB = document.getElementById('cv-img-b');
    document.getElementById('cv-label-a').textContent = 'Fecha A: ' + fechaA;
    document.getElementById('cv-label-b').textContent = 'Fecha B: ' + fechaB;

    try {
        const [imgA, imgB] = await Promise.all([cvLoadImg(urlA), cvLoadImg(urlB)]);

        // Cache para regenerar al mover sliders sin re-descargar
        cvImgACache = imgA;
        cvImgBCache = imgB;

        imgEA.src = urlA;
        imgEA.style.display = 'block';
        imgEB.src = urlB;
        imgEB.style.display = 'block';

        const canvas = document.getElementById('cv-canvas-composite');
        let mensajeOk;
        if (cvTipoVisualizacion === 'heatmap') {
            cvGenerarHeatmap(imgA, imgB, canvas, cvSensibilidad);
            mensajeOk = 'Heatmap generado (' + canvas.width + '×' + canvas.height + ' px, umbral ' +
                cvSensibilidad + '%). Rojo = pixeles más brillantes en ' + fechaB +
                ' · Azul = más brillantes en ' + fechaA + '.';
        } else if (cvTipoVisualizacion === 'highlight') {
            cvGenerarHighlight(imgA, imgB, canvas, cvHlOpacidad, cvHlUmbral);
            mensajeOk = 'Highlight overlay generado (' + canvas.width + '×' + canvas.height +
                ' px). Máscara roja sobre ' + fechaB + ' donde |Δluminancia| > ' + cvHlUmbral +
                '% (opacidad ' + cvHlOpacidad + '%). Movés los sliders para re-renderizar en vivo.';
        } else {
            cvGenerarComposicion(imgA, imgB, canvas);
            mensajeOk = 'Comparación generada (' + canvas.width + '×' + canvas.height + ' px). ' +
                'Cian = apareció en ' + fechaB + ' · Rojo = desapareció de ' + fechaA + '.';
        }

        status.className = 'cv-status';
        status.textContent = mensajeOk;
        btnDl.disabled = false;
    } catch (e) {
        status.className = 'cv-status error';
        clearEl(status);
        status.appendChild(text('Error: ' + e.message + '. Verifica que existan los PNG ' + cvTipoImagen + ' de ambas fechas.'));
        imgEA.style.display = 'none';
        imgEB.style.display = 'none';
    } finally {
        btnGen.disabled = false;
    }
}

function cvDescargar() {
    const canvas = document.getElementById('cv-canvas-composite');
    const volcan = document.getElementById('cv-volcan').value || 'volcan';
    const fechaA = document.getElementById('cv-fecha-a').value || 'A';
    const fechaB = document.getElementById('cv-fecha-b').value || 'B';
    try {
        const link = document.createElement('a');
        let prefix;
        if (cvTipoVisualizacion === 'heatmap') {
            prefix = 'heatmap';
        } else if (cvTipoVisualizacion === 'highlight') {
            prefix = 'highlight';
        } else {
            prefix = 'rgb_multidate';
        }
        link.download = prefix + '_' + volcan + '_' + fechaA + '_vs_' + fechaB + '_' + cvTipoImagen + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    } catch (e) {
        const status = document.getElementById('cv-status');
        status.className = 'cv-status error';
        status.textContent = 'No se pudo exportar (posible CORS): ' + e.message;
    }
}

(async function cvInit() {
    try {
        cvCrearUI();
        await cvCargarFechas();
        cvPopularVolcanes();
    } catch (e) {
        const status = document.getElementById('cv-status');
        if (status) {
            status.className = 'cv-status error';
            status.textContent = 'No se pudo cargar fechas_disponibles_copernicus.json: ' + e.message;
        }
    }
})();
</script>
