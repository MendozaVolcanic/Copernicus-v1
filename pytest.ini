[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -ra
markers =
    slow: tests slower than 1s (deselect with '-m "not slow"')
    network: tests requiring network access (always mocked in suite)
filterwarnings =
    ignore::DeprecationWarning
