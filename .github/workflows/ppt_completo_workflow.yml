# ============================================================================
# WORKFLOW: PPT EVALUACIÓN COMPLETA (TODOS LOS VOLCANES)
# ============================================================================
# Genera GIFs + PPTs para todos los volcanes en el rango de fechas indicado.
# Borra GIFs anteriores de timelapses_ppt/ antes de generar los nuevos.
# ============================================================================

name: PPT Evaluación Completa (Todos los Volcanes)

on:
  workflow_dispatch:
    inputs:
      fecha_inicio:
        description: 'Fecha inicio (YYYY-MM-DD)'
        required: true
        default: '2026-03-01'
      fecha_fin:
        description: 'Fecha fin (YYYY-MM-DD)'
        required: true
        default: '2026-03-30'

permissions:
  contents: write

jobs:
  generar-gifs-y-ppts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install Pillow requests pandas python-pptx

      - name: Verificar plantilla
        run: |
          if [ ! -f "docs/plantillas/Cambios_morfologicos.pptx" ]; then
            echo "❌ Plantilla NO encontrada: docs/plantillas/Cambios_morfologicos.pptx"
            exit 1
          fi
          echo "✅ Plantilla encontrada"

      - name: Limpiar GIFs anteriores de timelapses_ppt
        run: |
          echo "🗑️  Eliminando GIFs anteriores..."
          find docs/sentinel2 -path "*/timelapses_ppt/*.gif" -delete 2>/dev/null || true
          echo "✅ Limpieza completada"

      - name: Generar timelapses para el rango seleccionado
        env:
          FECHA_INICIO: ${{ github.event.inputs.fecha_inicio }}
          FECHA_FIN: ${{ github.event.inputs.fecha_fin }}
        run: |
          echo "🎬 Generando GIFs: $FECHA_INICIO → $FECHA_FIN"
          python timelapse_generator.py

      - name: Generar PPTs para todos los volcanes
        run: |
          echo "📊 Generando PPTs..."
          python ppt_generator.py

      - name: Guardar resultados en GitHub
        run: |
          git config user.name "PPTCompletoBot"
          git config user.email "pptcompleto@copernicus.com"

          git add docs/sentinel2/**/timelapses_ppt/*.gif || true
          git add docs/sentinel2/**/reportes/*.pptx || true

          if git diff --quiet --staged; then
            echo "⚠️ No hay archivos nuevos para guardar"
            exit 0
          fi

          git commit -m "PPT Completo: ${{ github.event.inputs.fecha_inicio }} → ${{ github.event.inputs.fecha_fin }}"

          max_retries=5
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            echo "📤 Intento $((retry_count + 1))..."
            git pull origin main --rebase -X ours || true
            if git push origin main; then
              echo "✅ Push exitoso"
              exit 0
            fi
            retry_count=$((retry_count + 1))
            [ $retry_count -lt $max_retries ] && sleep $((retry_count * 3))
          done

          echo "❌ Push falló después de $max_retries intentos"
          exit 1
