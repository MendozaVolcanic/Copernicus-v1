name: Re-descargar TODOS los Volcanes

# Serializa con los workflows que pushean a main (no pisar el push del cron/watcher).
concurrency:
  group: push-main
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribir YES para confirmar borrado'
        required: true
        default: 'NO'

permissions:
  contents: write

jobs:
  redescargar-todos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Verificar confirmacion
        run: |
          if [ "${{ github.event.inputs.confirmar }}" != "YES" ]; then
            echo "❌ Debes escribir YES para confirmar"
            echo "⚠️ Este workflow borrará TODAS las imágenes PNG"
            exit 1
          fi
          echo "✅ Confirmación recibida"
      
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Contar imagenes actuales
        run: |
          echo "📊 ESTADO ACTUAL:"
          total=$(find docs/sentinel2/ -name "*.png" -type f 2>/dev/null | wc -l || echo 0)
          echo "   Imágenes PNG: $total"
      
      - name: Borrar TODAS las imagenes PNG
        run: |
          echo "🗑️ BORRANDO IMÁGENES..."
          find docs/sentinel2/ -name "*.png" -type f -delete
          
          # También borrar metadata.csv
          find docs/sentinel2/ -name "metadata.csv" -type f -delete
          
          echo "✅ Imágenes y metadata borrados"
      
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Re-descargar con MAX_CLOUD_COVER=100
        env:
          SH_CLIENT_ID: ${{ secrets.SH_CLIENT_ID }}
          SH_CLIENT_SECRET: ${{ secrets.SH_CLIENT_SECRET }}
        run: |
          echo "📥 RE-DESCARGANDO TODOS LOS VOLCANES..."
          echo "Configuración: MAX_CLOUD_COVER=100 (incluso días nublados)"
          python sentinel2_downloader.py
      
      - name: Contar imagenes nuevas
        run: |
          echo "📊 ESTADO FINAL:"
          total_nuevas=$(find docs/sentinel2/ -name "*.png" -type f 2>/dev/null | wc -l || echo 0)
          echo "   Imágenes nuevas: $total_nuevas"
          
          if [ $total_nuevas -eq 0 ]; then
            echo "❌ No se descargaron imágenes nuevas"
            exit 1
          fi
      
      - name: Commit cambios con retry
        run: |
          git config user.name "RedownloadBot"
          git config user.email "redownload@copernicus.com"
          
          git add docs/sentinel2/
          
          if git diff --quiet --staged; then
            echo "⚠️ No hay cambios para guardar"
            exit 0
          fi
          
          # Commit
          git commit -m "Re-descarga: TODOS los volcanes con MAX_CLOUD_COVER=100"
          
          # Push con retry (hasta 5 intentos)
          max_retries=5
          retry_count=0

          while [ $retry_count -lt $max_retries ]; do
            echo "Intento $((retry_count + 1)) de push..."

            # FIX 2026-06-14: patron seguro (igual que copernicus.yml). Antes
            # "git merge -X ours" descartaba el lado remoto en cada conflicto,
            # pudiendo perder imagenes nuevas commiteadas por otro bot. Ahora:
            # fast-forward si se puede; si no, rebase con preferencia a remoto
            # (-X theirs) y se aborta antes de pisar cambios remotos.
            git fetch origin main
            if ! git merge --ff-only origin/main; then
              echo "No fast-forward posible, rebase con preferencia a remoto..."
              if ! git pull origin main --rebase -X theirs; then
                echo "Rebase fallo, abortando para no perder cambios remotos."
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
            fi

            if git push origin main; then
              echo "Push exitoso"
              exit 0
            else
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $max_retries ]; then
                echo "Push fallo, esperando $((retry_count * 5)) segundos..."
                sleep $((retry_count * 5))
              fi
            fi
          done

          echo "Push fallo despues de $max_retries intentos"
          exit 1
