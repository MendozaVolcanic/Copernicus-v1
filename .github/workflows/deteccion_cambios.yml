name: Deteccion Automatica de Cambios (V1 LEGACY - DESHABILITADO)

# V1 deshabilitado 2026-04-23: reemplazado por change_analysis.yml (V2 con Z-score).
# Se mantiene el archivo para referencia. Solo corre manualmente via workflow_dispatch.
on:
  workflow_dispatch:

# FIX 2026-06-14: grupo COMPARTIDO 'push-main' (ver copernicus.yml). Aunque solo
# corre manualmente, pushea a main (paso "Commit alertas") -> debe serializarse
# con los demas workflows que pushean a main para no competir por el push.
concurrency:
  group: push-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detectar-cambios:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: pip install requests numpy Pillow pandas pytz
      
      - name: Crear script de deteccion
        run: |
          cat > detect_changes.py << 'EOFSCRIPT'
          import sys
          sys.path.append('.')
          
          from change_detector import obtener_cambio_maximo
          from firms_integration import cross_reference_sentinel_firms, verificar_alertas_firms
          from alert_generator import generar_alerta_markdown, crear_resumen_alertas
          from config_sentinel2 import VOLCANES
          import os
          
          print('='*80)
          print('DETECCION AUTOMATICA DE CAMBIOS')
          print('='*80)
          
          api_key = os.getenv('NASA_FIRMS_API_KEY')
          
          if api_key:
              print('API Key configurada')
          else:
              print('API Key NO configurada')
          
          alertas = []
          
          for volcan_nombre, config in VOLCANES.items():
              print(f'Analizando: {volcan_nombre}')
              
              try:
                  cambio = obtener_cambio_maximo(volcan_nombre)
                  
                  if not cambio or not cambio.get('cambio_detectado'):
                      print(f'  Sin cambios')
                      continue
                  
                  print(f'  Cambio: {cambio["porcentaje_cambio"]}%')
                  
                  nivel = cross_reference_sentinel_firms(
                      volcan_nombre,
                      config['lat'],
                      config['lon'],
                      cambio,
                      api_key=api_key
                  )
                  
                  print(f'  Nivel: {nivel}')
                  
                  if nivel in ['ALERTA_CRITICA', 'ALERTA_MODERADA', 'ALERTA_MENOR']:
                      firms_resultado = None
                      if api_key:
                          firms_resultado = verificar_alertas_firms(
                              volcan_nombre,
                              config['lat'],
                              config['lon'],
                              dias_atras=7,
                              api_key=api_key
                          )
                      
                      alerta = generar_alerta_markdown(
                          volcan_nombre,
                          nivel,
                          cambio,
                          firms_resultado
                      )
                      
                      alertas.append(alerta)
              
              except Exception as e:
                  print(f'  Error: {e}')
                  continue
          
          print('='*80)
          print(f'Total alertas: {len(alertas)}')
          
          if alertas:
              crear_resumen_alertas(alertas)
              
              criticas = sum(1 for a in alertas if a['nivel'] == 'ALERTA_CRITICA')
              moderadas = sum(1 for a in alertas if a['nivel'] == 'ALERTA_MODERADA')
              menores = sum(1 for a in alertas if a['nivel'] == 'ALERTA_MENOR')
              
              print(f'Criticas: {criticas}')
              print(f'Moderadas: {moderadas}')
              print(f'Menores: {menores}')
          else:
              print('Sin alertas')
          
          print('='*80)
          EOFSCRIPT
      
      - name: Ejecutar deteccion
        env:
          NASA_FIRMS_API_KEY: ${{ secrets.NASA_FIRMS_API_KEY }}
        run: python detect_changes.py
      
      - name: Commit alertas
        run: |
          git config user.name "AlertBot"
          git config user.email "alert@copernicus.com"
          git add docs/alertas/*.md 2>/dev/null || true
          if git diff --quiet --staged 2>/dev/null; then
            echo "Sin alertas nuevas"
          else
            git commit -m "Alertas: $(date +'%Y-%m-%d')"
            git pull origin main --rebase -X ours || true
            git push origin main || true
          fi
